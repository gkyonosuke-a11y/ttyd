<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AMW Z Solver</title>
<style>
body{font-family:sans-serif; margin:20px}
input{font:inherit; width:10ch}
table{border-collapse:collapse; margin-top:20px}
th,td{border:1px solid #ccc; padding:4px 10px; text-align:left}
tr.candidate td{background:#dcf0dc}
select{font:inherit}
input[type=radio]{width:auto; margin-right:4px}
label{margin-right:14px; white-space:nowrap}
</style>
</head>
<body>

<h1>AMW Z Solver V4.0</h1>

<!--======初期表示==================================-->
<p>Region
<select id="reg">
  <option value="0">JP</option>
  <option value="1">US</option>
  <option value="2">EU1</option>
  <option value="3">EU2</option>
</select></p>

<p>Target address <input id="a" value="8041AEDC"></p>
<p>Z range <input id="lo" type="number" step="any" value="-135"> – <input id="hi" type="number" step="any" value="167"></p>
<p>Min |Z| <input id="eps" type="number" step="any" value="0.0001"></p>

<p id="formulas"></p>

<p>Branch
<label><input type="radio" name="branch" value="-1" checked>All</label>
<label><input type="radio" name="branch" value="0">SoundEfxStop</label>
<label><input type="radio" name="branch" value="1">SoundSSStopCh</label>
<label><input type="radio" name="branch" value="2">SoundSongStopCh</label>
</p>

<div id="out"></div>
<script>
// AMW用に書き込みたいアドレスからZ座標を求める
//======script用の設定==============================
var TWO32 = 4294967296;   // 2^32

// 書き込み経路
//   base      = 添字 0 のときの書き込み先
//   stride    = 添字が 1 増えるごとに進むバイト数
//   storeSize = 書き込み幅
var BRANCHES_JP = [
  { name: "SoundEfxStop",    base: 0x806E0640, stride: 0x88,  storeSize: 2 },
  { name: "SoundSSStopCh",   base: 0x806E1E80, stride: 0x138, storeSize: 2 },
  { name: "SoundSongStopCh", base: 0x806E05E0, stride: 0x10,  storeSize: 4 }
];

var BRANCHES_US = [
  { name: "SoundEfxStop",    base: 0x806EED40, stride: 0x88,  storeSize: 2 },
  { name: "SoundSSStopCh",   base: 0x806F0580, stride: 0x138, storeSize: 2 },
  { name: "SoundSongStopCh", base: 0x80679260, stride: 0x10,  storeSize: 4 }
];

var BRANCHES_EU1 = [
  { name: "SoundEfxStop",    base: 0x8072FC60, stride: 0x88,  storeSize: 2 },
  { name: "SoundSSStopCh",   base: 0x807314A0, stride: 0x138, storeSize: 2 },
  { name: "SoundSongStopCh", base: 0x806BA180, stride: 0x10,  storeSize: 4 }
];

var BRANCHES_EU2 = [
  { name: "SoundEfxStop",    base: 0x806FB860, stride: 0x88,  storeSize: 2 },
  { name: "SoundSSStopCh",   base: 0x806FD0A0, stride: 0x138, storeSize: 2 },
  { name: "SoundSongStopCh", base: 0x80685D80, stride: 0x10,  storeSize: 4 }
];

var REGIONS = [BRANCHES_JP, BRANCHES_US, BRANCHES_EU1, BRANCHES_EU2];


//======表示用の変換==============================
var buf     = new ArrayBuffer(4);
var asBits  = new Uint32Array(buf);
var asFloat = new Float32Array(buf);

// ビット列 float32として読み直す
function bitsToFloat(bits){
  asBits[0] = bits;
  return asFloat[0];
}

// 16進数8桁(ゼロ埋め)に変換
function hex(n){
  return ("0000000" + n.toString(16).toUpperCase()).slice(-8);
}


//======計算==============================
// 分岐がaddrに書き込むようなZを全部返す(下記を満たす z の一覧)
//     base + z * stride == addr   (mod 2^32)
function solve(addr, base, stride){

  //z * stride == target(mod 2^32)の形にする
  //+TWO32はJSの%が左辺負のとき負を返すのを避けるため
  var target = (addr - base + TWO32) % TWO32;

  // mod を外して整数の等式にするとz * stride = target + m * 2^32
  // zは32bitなのでz * stride < stride * 2^32でmは0~stride-1のどれかにしかならない
  // mを総当たりして、割り切れたものが解
  var all = [];
  for (var m = 0; m < stride; m++){
    var z = (target + m * TWO32) / stride;
    if (Number.isInteger(z)) all.push(z);
  }
  return all;
}


//======結果表示==============================

// 入力を読んで表を作り直す
function render(){
  var text = a.value.trim().replace(/^0x/i, "");

  // Z座標の取りえる範囲。範囲欄が空なら上限なし・下限なし
  var min = parseFloat(lo.value);
  var max = parseFloat(hi.value);
  if (isNaN(min)) min = -Infinity;
  if (isNaN(max)) max = Infinity;

  // 候補とみなすZの絶対値の下限。空欄なら下限なし
  var minAbs = parseFloat(eps.value);
  if (isNaN(minAbs)) minAbs = 0;

  // 選んだリージョンの経路一覧
  var BRANCHES = REGIONS[Number(reg.value)];
  var picked   = Number(document.querySelector("input[name=branch]:checked").value);
  var shown    = picked < 0 ? BRANCHES : [BRANCHES[picked]];

  // 式を表示
  formulas.innerHTML = BRANCHES.map(function(branch){
    return branch.name + ": addr = 0x" + hex(branch.base)
         + " + Z * 0x" + branch.stride.toString(16).toUpperCase();
  }).join("<br>");

  // 16進数で8桁のときだけ解く
  if (!/^[0-9a-f]{8}$/i.test(text)){
    out.innerHTML = "";
    return;
  }

  // キャッシュ側とミラーは同じ場所なので、0xC...で入力されても0x8...に直して両方まとめて調べる。
  var target = parseInt(text, 16);
  if (target >= 0xC0000000) target -= 0x40000000;

  var rows = "";
  shown.forEach(function(branch){

    // 0xC...への4バイト未満の書き込みは、8バイト境界のブロックごと潰れる。
    // 標的が8の倍数でないときはブロックの先頭が標的の4バイト手前になり、そこから書いて後半で標的に届く。
    var mirror = (target + 0x40000000) >>> 0;
    var writes = [
      { addr: target, bytes: branch.storeSize },
      branch.storeSize < 4
        ? { addr: (mirror & ~7) >>> 0, bytes: 8 }
        : { addr: mirror,             bytes: branch.storeSize }
    ];

    // 1つの配列にまとめる
    var found = [];
    writes.forEach(function(write){
      solve(write.addr, branch.base, branch.stride).forEach(function(z){
        found.push({ bits: z, value: bitsToFloat(z), bytes: write.bytes, addr: write.addr });
      });
    });

    // 値の小さい順に並べ直す
    found.sort(function(x, y){
        return x.value - y.value;
      })
      .forEach(function(s){
        // 範囲内で、かつ0に近すぎないものを候補として色を付ける
        var inRange   = s.value >= min && s.value <= max;
        var overMin   = Math.abs(s.value) >= minAbs;
        var candidate = inRange && overMin;

        // 10進は数値をそのまま連結
        rows += "<tr" + (candidate ? " class=\"candidate\"" : "") + "><td>" + branch.name
              + "</td><td>0x" + hex(s.bits)
              + "</td><td>" + s.value
              + "</td><td>" + s.bytes
              + "</td><td>0x" + hex(s.addr)
              + "</td><td>" + (inRange ? "O" : "-")
              + "</td><td>" + (overMin ? "O" : "-")
              + "</td></tr>";
      });
  });

  // 行が1つも無いときはNo solution.と表示
  out.innerHTML = rows
    ? "<table><tr><th>Branch</th><th>Z coordinate</th><th>Decimal</th><th>Write Bytes</th><th>Write addr</th><th>In range</th><th>Min |Z|</th></tr>" + rows + "</table>"
    : "<p>No solution.</p>";
}

[a, lo, hi, eps, reg].forEach(function(el){ el.oninput = render; });
document.querySelectorAll("input[name=branch]").forEach(function(el){ el.onchange = render; });
render();
</script>
</body>
</html>
